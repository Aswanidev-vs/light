plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wails.app'
    compileSdk 35
    ndkVersion "26.3.11579264"

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.light.fileshare"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName System.getenv("APP_VERSION") ?: "0.1.0"

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    // Configure ABI splits to generate per-architecture APKs (~16-18MB each instead of 53MB fat APK)
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    // Accept the Android-prefixed variables used by this repository and the
    // shorter names used by the shared Miku-style CI signing setup.
    def envValue = { String primary, String fallback ->
        def value = System.getenv(primary)
        value != null && !value.trim().isEmpty() ? value : System.getenv(fallback)
    }
    def keystoreFile = envValue("ANDROID_KEYSTORE_FILE", "KEYSTORE_FILE")
    def keystorePassword = envValue("ANDROID_KEYSTORE_PASSWORD", "KEYSTORE_PASSWORD")
    def releaseKeyAlias = envValue("ANDROID_KEY_ALIAS", "KEY_ALIAS")
    def releaseKeyPassword = envValue("ANDROID_KEY_PASSWORD", "KEY_PASSWORD")
    def hasKeystore = [keystoreFile, keystorePassword, releaseKeyAlias, releaseKeyPassword].every {
        it != null && !it.trim().isEmpty()
    }

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword keystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
